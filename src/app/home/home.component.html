<div class="container my-4">

  <!-- ✅ Statistiques Globales affichées en ligne -->
  <div class="row text-center g-4">
    <div class="col-12 col-md-3">
      <div class="stats-card h-100">
        <h6 class="text-secondary">TOTAL TESTS</h6>
        <h2 class="fw-bold text-dark">{{ testsTotal || 0 }}</h2>
      </div>
    </div>
    <div class="col-12 col-md-3">
      <div class="stats-card h-100">
        <h6 class="text-secondary">TOTAL AGENTS</h6>
        <h2 class="fw-bold text-dark">{{ agentStatuses?.length || 0 }}</h2>
      </div>
    </div>
    <div class="col-12 col-md-3">
      <div class="stats-card h-100">
        <h6 class="text-success">AGENTS ACTIFS</h6>
        <h2 class="fw-bold text-success">{{ getActiveCount() || 0 }}</h2>
      </div>
    </div>
    <div class="col-12 col-md-3">
      <div class="stats-card h-100">
        <h6 class="text-danger">AGENTS INACTIFS</h6>
        <h2 class="fw-bold text-danger">{{ getInactiveCount() || 0 }}</h2>
      </div>
    </div>
  </div>

  <!-- ✅ Graphiques côte à côte avec plus d’espace au-dessus -->
  <div class="row mt-6">
    <!-- 📊 Graphique circulaire -->
    <div class="col-md-6" *ngIf="emailChartData && emailChartLegendItems">
      <div class="card-modern-blue p-4 h-100">
        <h4 class="text-center mb-3">Statistiques des Tests TWAMP</h4>
        <lbd-chart
          [title]="'% Réussis / Échoués'"
          [chartType]="emailChartType"
          [chartData]="emailChartData"
          [legendItems]="emailChartLegendItems"
          [colors]="['#4a5e80', '#a1b5d8']" > 
        </lbd-chart>
        <ul class="legend mt-3 d-flex justify-content-center" *ngIf="emailChartLegendItems?.length">
          <li class="mx-2" *ngFor="let item of emailChartLegendItems">
            <ng-container *ngIf="item?.title">
              <i [ngClass]="{
                'fa fa-circle text-success': item.title === 'Réussis',
                'fa fa-circle text-danger': item.title === 'Échoués',
                'fa fa-circle text-secondary': item.title !== 'Réussis' && item.title !== 'Échoués'
              }"></i>
              <span>{{ item.title }}</span>
            </ng-container>
          </li>
        </ul>
      </div>
    </div>

    <!-- 📊 Graphique en barres -->
    <div class="col-md-6" *ngIf="testTypeChartData && testTypeChartLegendItems">
      <div class="card-modern-lavender p-4 h-100">
        <h4 class="text-center mb-3">Répartition des Types de Tests</h4>
        <lbd-chart
          [title]="'Plan vs Rapides'"
          [chartType]="testTypeChartType"
          [chartData]="testTypeChartData"
          [chartOptions]="testTypeChartOptions"
          [legendItems]="testTypeChartLegendItems"
          [colors]="['#4a5e80', '#E91E63']"> 
        </lbd-chart>
        <ul class="legend mt-3 d-flex justify-content-center" *ngIf="testTypeChartLegendItems?.length">
          <li class="mx-2" *ngFor="let item of testTypeChartLegendItems">
            <ng-container *ngIf="item?.title">
              <i [ngClass]="{
                'fa fa-square text-primary': item.title === 'Test Plan',
                'fa fa-square text-warning': item.title === 'Test Rapides',
                'fa fa-square text-secondary': item.title !== 'Test Plan' && item.title !== 'Test Rapides'
              }"></i>
              <span>{{ item.title }}</span>
            </ng-container>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
