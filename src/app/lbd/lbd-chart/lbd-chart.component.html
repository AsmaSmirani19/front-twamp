<div class="card">
  <div class="header">
    <h4 class="title">{{ title }}</h4>
    <p class="category">{{ subtitle }}</p>
  </div>
  <div class="content">
    <!-- Conteneur du graphique -->
    <div [id]="chartId" [ngClass]="['ct-chart', chartClass ? chartClass : '']"></div>
    <div class="footer">
      <div class="legend">
        <span *ngFor="let item of legendItems">
          <i *ngIf="item && isValidClass(item.imageClass)" [ngClass]="item.imageClass"></i>

        </span>
      </div>
      <hr *ngIf="withHr" />
      <div class="stats">
        <i *ngIf="footerIconClass" [ngClass]="footerIconClass"></i> {{ footerText }}
      </div>
    </div>
  </div>
</div>
